name: Release (Electron)

# Triggered by pushing a version tag: git tag v1.13 && git push origin v1.13
# Runs in parallel with the existing release.yml (Docker + legacy .app) workflow.
on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Job 1: macOS — build Python sidecar, sign, notarize, package DMG ─────────
  electron-macos:
    name: macOS DMG (signed + notarized)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Install dependencies ──────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install "pyinstaller==6.19.0" rumps certifi

      - name: Install Node dependencies
        run: npm ci

      # ── Write desktop_config.py from secrets ─────────────────────────────────
      - name: Write desktop_config.py
        env:
          PCO_CLIENT_ID:        ${{ secrets.PCO_CLIENT_ID }}
          PCO_CLIENT_SECRET:    ${{ secrets.PCO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python - <<'PYEOF'
          import os
          lines = [
              'PCO_CLIENT_ID = "{}"\n'.format(os.environ.get("PCO_CLIENT_ID", "")),
              'PCO_CLIENT_SECRET = "{}"\n'.format(os.environ.get("PCO_CLIENT_SECRET", "")),
              'GOOGLE_CLIENT_ID = "{}"\n'.format(os.environ.get("GOOGLE_CLIENT_ID", "")),
              'GOOGLE_CLIENT_SECRET = "{}"\n'.format(os.environ.get("GOOGLE_CLIENT_SECRET", "")),
          ]
          with open("desktop_config.py", "w") as f:
              f.writelines(lines)
          print("desktop_config.py written.")
          PYEOF

      # ── Build Python sidecar with PyInstaller ─────────────────────────────────
      # The spec bundles launcher.py; the resulting one-file executable is the
      # sidecar that electron-builder copies into the .app via extraResources.
      # Output: dist/BulletinGenerator (single executable, no .app wrapper here —
      # electron-builder creates the final .app around it).
      - name: Build Python sidecar with PyInstaller
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pyinstaller bulletin-generator.spec --onefile --name server --distpath dist
          ls -lh dist/server

      # ── Import signing certificate ────────────────────────────────────────────
      - name: Import Developer ID certificate
        env:
          CSC_LINK:         ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign

          # Developer ID G2 intermediate CA (required for notarization chain)
          curl -sL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ── Build + notarize + publish macOS DMG via electron-builder ────────────
      - name: Build and publish macOS DMG
        env:
          GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID:               ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD:      ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID:          ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK:               ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:       ${{ secrets.CSC_KEY_PASSWORD }}
          APP_VERSION:            ${{ github.ref_name }}
        run: |
          npx electron-builder --mac --publish always

  # ── Job 2: Windows — build Python sidecar and package NSIS installer ─────────
  electron-windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Install dependencies ──────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install "pyinstaller==6.19.0" certifi

      - name: Install Node dependencies
        run: npm ci

      # ── Write desktop_config.py from secrets ─────────────────────────────────
      - name: Write desktop_config.py
        env:
          PCO_CLIENT_ID:        ${{ secrets.PCO_CLIENT_ID }}
          PCO_CLIENT_SECRET:    ${{ secrets.PCO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: python
        run: |
          import os
          lines = [
              'PCO_CLIENT_ID = "{}"\n'.format(os.environ.get("PCO_CLIENT_ID", "")),
              'PCO_CLIENT_SECRET = "{}"\n'.format(os.environ.get("PCO_CLIENT_SECRET", "")),
              'GOOGLE_CLIENT_ID = "{}"\n'.format(os.environ.get("GOOGLE_CLIENT_ID", "")),
              'GOOGLE_CLIENT_SECRET = "{}"\n'.format(os.environ.get("GOOGLE_CLIENT_SECRET", "")),
          ]
          with open("desktop_config.py", "w") as f:
              f.writelines(lines)
          print("desktop_config.py written.")

      # ── Build Python sidecar with PyInstaller ─────────────────────────────────
      # On Windows `rumps` is macOS-only and must be excluded from the spec.
      # We use --onefile + --name server so electron-builder finds dist/server.exe.
      - name: Build Python sidecar with PyInstaller
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pyinstaller bulletin-generator.spec --onefile --name server --distpath dist
          dir dist

      # ── Build + publish Windows NSIS installer via electron-builder ───────────
      # Windows signing: no certificate is configured for Windows builds.
      # signingHashAlgorithms is set to null in package.json (skip signing).
      # TODO: add a Windows code-signing certificate when available.
      - name: Build and publish Windows installer
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          npx electron-builder --win --publish always
